# Справочник пород.
#
# Плотность — кг/м³ при влажности ~12%. Усушка — % от сырого до абсолютно
# сухого, тангенциальная и радиальная.
#
# Числа сверены вручную по справочникам, источники — в конце этой шапки.
#
# Палитра торца сверяется глазами, и сверены все двенадцать пород. Сверять так:
# `uv run boardforge swatches` рисует лист образцов, на нём видно, что править.
# После правки поставьте породе `verified: true` — на листе пропадёт пометка
# «не сверено». Новой породе галочку не ставьте, пока не посмотрели на лист:
# на неё смотрит не только человек, но и смета Дня 5.
#
# Правя файл вручную, не оставляйте ключ без значения: `fades:` без `true`
# читается как пустое значение и молча гасит признак. Структуру файла проверяет
# tests/core/test_species_yaml.py — прогоняйте тесты после ручных правок.
#
#   base              усреднённый тон торца под маслом, sRGB; им заливается
#                     ячейка там, где текстуру не рисуют (мелкий масштаб,
#                     плоский режим)
#   earlywood         рыхлая ранняя древесина — фон внутри кольца
#   latewood          плотная поздняя древесина — сама тёмная полоса кольца
#   ray               сердцевинные лучи, поперёк колец
#   ring_width_mm     период годичного кольца, мм
#   latewood_fraction какую долю периода занимает тёмная зона, 0–1. Не то же,
#                     что контраст: у венге прослойка узкая и очень тёмная,
#                     у клёна широкая и почти неразличимая. Узкая зона рисуется
#                     темнее широкой при том же ring_contrast — так она и
#                     читается на настоящем торце
#   ring_contrast     выраженность колец, 0–1: базовая непрозрачность штриха
#                     поздней зоны до поправки на её ширину
#   ray_width_mm      толщина сердцевинного луча, мм: у дуба лучи широкие,
#                     у бука узкие, у клёна почти нитевидные
#   ray_contrast      выраженность лучей, 0–1; 0 — лучей не видно вовсе
#   verified          сверял ли человек эти цвета глазами; последняя строка
#                     палитры
#
# Незаданные поля палитры выводятся из `base`, так что чужой справочник может
# ограничиться одним цветом.
# Источники данных:
#   Усушка — Wood Handbook FPL-GTR-282, гл. 4, табл. 4-3 и 4-4.
#   Плотность при 12% влажности — The Wood Database.
#   hornbeam, padauk, wenge в Wood Handbook отсутствуют — усушка по The Wood Database.
#   oak — белый дуб (Quercus alba), beech — европейский (Fagus sylvatica),
#   ash — белый (Fraxinus americana), jatoba — по FPL проходит как Courbaril.

maple_hard:
  name: Клён сахарный
  density: 705
  shrinkage: {tangential: 9.9, radial: 4.8}
  palette:
    base: "#e6d4ac"
    earlywood: "#ece0bf"
    latewood: "#cdb489"
    ray: "#f4ecd8"
