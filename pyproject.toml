[project]
name = "boardforge"
version = "0.1.0"
description = "Генератор узоров для торцевых разделочных досок"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "shapely>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardforge"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
