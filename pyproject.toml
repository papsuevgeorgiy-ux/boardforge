[project]
name = "boardforge"
version = "0.1.0"
description = "Генератор узоров для торцевых разделочных досок"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "shapely>=2.1",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
boardforge = "boardforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardforge"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.165.2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Свой basetemp вместо системного %TEMP%: там заводится каталог с битыми ACL,
# и tmp_path падает PermissionError ещё до первого теста.
#
# Каталог сменён на Дне 4: та же порча ACL повторилась и на `.pytest-tmp`
# в репозитории — `takeown` без прав администратора его не берёт. Значит дело
# не в %TEMP%, а в самом каталоге, и лечится только переездом. Старый остаётся
# лежать: он в .gitignore и никому не мешает.
# Имя без вложенности: родительский каталог pytest не создаёт.
addopts = "-q --basetemp=.pytest-run"
