[project]
name = "boardforge"
version = "0.1.0"
description = "Генератор узоров для торцевых разделочных досок"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "shapely>=2.1",
    "trimesh>=5.0.0",
    "uvicorn[standard]>=0.32",
    "weasyprint>=69.0",
]

[project.scripts]
boardforge = "boardforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardforge"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.165.2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--basetemp` здесь больше нет намеренно: именно он и делал каталог
# недоступным. Разбор причины и замена — в conftest.py в корне.
addopts = "-q"
# Расхождение версий внутри FastAPI: starlette ругается на httpx в собственном
# TestClient. На работу не влияет, но мусорит каждый прогон. Глушим по классу,
# а не по тексту — текст в следующей версии сменится, класс нет.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
